name: diag
on:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          S: ${{ secrets.MCP_SECRET }}
        run: |
          B=https://paper-trail-connector.mdruec.workers.dev
          K=RbAZJhVsx6D5eXScWypzp4bdoyt5O-V4
          {
          echo "secret length=${#S} same_as_known=$([ "$S" = "$K" ] && echo yes || echo no)"
          echo "== GET /"; curl -s -i $B/ | head -12
          echo "== GET known path"; curl -s -i $B/mcp/$K | head -6
          echo "== POST initialize (known path)"; curl -s -i -X POST $B/mcp/$K -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"diag","version":"1"}}}'
          echo; echo "== POST tools/list"; curl -s -X POST $B/mcp/$K -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | head -c 200
          echo; echo "== well-known"; for p in /.well-known/oauth-protected-resource /.well-known/oauth-protected-resource/mcp/$K /.well-known/oauth-authorization-server; do echo "$p -> $(curl -s -o /dev/null -w '%{http_code} %{content_type}' $B$p)"; done
          } 2>&1 | sed "s/$K/<SECRET>/g" > diag.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add diag.txt; git commit -m "diag" && git pull --rebase && git push
